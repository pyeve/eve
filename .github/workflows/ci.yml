name: CI

on: [push, pull_request, workflow_dispatch]

jobs:
  tests:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}

    strategy:
      matrix:
        include:
          - { name: '3.14', python: '3.14', os: ubuntu-latest, tox: py314, mongodb: '5.0', redis: '6' }
          - { name: '3.13', python: '3.13', os: ubuntu-latest, tox: py313, mongodb: '5.0', redis: '6' }
          - { name: '3.12', python: '3.12', os: ubuntu-latest, tox: py312, mongodb: '5.0', redis: '6' }
          - { name: '3.11', python: '3.11', os: ubuntu-latest, tox: py311, mongodb: '5.0', redis: '6' }
          - { name: '3.10', python: '3.10', os: ubuntu-latest, tox: py310, mongodb: '5.0', redis: '6' }
          - { name: 'PyPy', python: 'pypy-3.11', os: ubuntu-latest, tox: pypy311, mongodb: '4.4', redis: '6' }

    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - uses: supercharge/mongodb-github-action@1.12.0
        with:
          mongodb-version: ${{ matrix.mongodb }}
      - uses: supercharge/redis-github-action@1.2.0
        with:
          redis-version: ${{ matrix.redis }}
      - name: Install dependencies
        run: |
          set -xe
          python -VV
          python -m site
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install --upgrade virtualenv tox tox-gh-actions
      - name: Start mongo ${{ matrix.mongodb }}
        # Use the shell bundled in the MongoDB container started above (legacy
        # `mongo` up to 5.0, `mongosh` afterwards), so nothing has to be
        # installed on the runner and we don't depend on its Ubuntu release.
        run: |
          SHELL_BIN=$(docker exec mongodb sh -c 'command -v mongosh || command -v mongo')
          docker exec mongodb "$SHELL_BIN" eve_test --quiet --eval 'db.createUser({user:"test_user", pwd:"test_pw", roles:["readWrite"]});'
      - name: Run tox targets for ${{ matrix.python }}
        run: tox -e ${{ matrix.tox }}
